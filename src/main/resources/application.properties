spring.application.name=jobportal

# Console Logging
logging.pattern.console=${CONSOLE_LOG_PATTERN:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %cyan(%msg%n)}

# Application Logging Level
#logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.dexturn.jobportal=${LOG_LEVEL:INFO}

# Logging Groups
logging.group.jobportal_error=com.dexturn.jobportal.security,com.dexturn.jobportal.contact
logging.level.jobportal_error=${LOG_LEVEL:ERROR}

# File Logging
logging.file.name=logs/jobportal.log
logging.pattern.file={"timestamp":"%d{yyyy-MM-dd HH:mm:ss}","level":"%p","logger":"%c","message":"%m"}%n

# Database
spring.datasource.url=jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3307}/${DATABASE_NAME:jobportal}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}
spring.jpa.properties.hibernate.default_batch_fetch_size=${DEFAULT_BATCH_FETCH_SIZE:50}


# Docker Compose
spring.docker.compose.lifecycle.management=start-and-stop
spring.docker.compose.start.command=up
spring.docker.compose.stop.command=stop


# Caching / Caffeine
spring.cache.type=caffeine
spring.cache.cache-names=jobs,companies,roles
spring.cache.caffeine.spec=maximunSize=5000,expireAfterWrite=1m